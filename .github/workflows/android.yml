name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 改了 web/ 忘了同步进 assets，装出来的 APK 还是旧页面，这里直接卡住
      - name: web/ 与 android assets 是否同步
        run: python3 scripts/sync_assets.py --check

      - name: Service Worker 语法
        run: node --check web/sw.js

  debug:
    name: 打 debug 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cuoti-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: 打 release 包并发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # 密钥以 base64 存在 Secrets 里，构建前还原成文件；仓库里永远没有 jks
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，打不了 release 包。见 docs/发布清单.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks

      - name: assembleRelease
        working-directory: android
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: 重命名产物
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk "cuoti-${TAG}.apk"
          echo "APK=cuoti-${TAG}.apk" >> "$GITHUB_ENV"

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
          fail_on_unmatched_files: true
