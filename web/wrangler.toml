name = "cuoti"
main = "worker.js"
compatibility_date = "2025-06-01"

# 静态资源：dist/ 里的网页、图标、题库包都由这个 Worker 直接发出去
[assets]
directory = "./dist"
binding = "ASSETS"

# 可选：按 IP 限流。控制台 → Storage & Databases → KV → 新建命名空间，
# 拿到 ID 后取消下面两行注释，再 `wrangler deploy`。
# [[kv_namespaces]]
# binding = "RATE"
# id = "把 KV 命名空间 ID 贴这里"
