<body>
<div id="app"></div>
<div id="toast"></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<script src="vendor/katex/katex.min.js"></script>
<script>
'use strict';
/* ============================================================
   0. 基础工具
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 公式渲染：三种输入都要能处理
   1) 规范的 $...$ / $$...$$
   2) 模型偷懒不写 $，直接给 \int \frac{...}
   3) 中文和公式混在一行
   渲染失败时回退成原文，绝不显示红色的报错源码。 */
const CJK_RE = /[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/;
function tryTex(tex, display) {
  try {
    const html = katex.renderToString(tex, { displayMode: !!display, throwOnError: false, strict: false });
    return html.indexOf('katex-error') >= 0 ? null : html;
  } catch (e) { return null; }
}
function looksMath(run) {
  return /\\[a-zA-Z]+|\^\{|_\{|\^[0-9A-Za-z]/.test(run);
}
function mdInline(escaped) {
  return String(escaped)
    .replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>');
}
function renderPlainRun(run) {
  if (!run) return '';
  if (!looksMath(run)) return mdInline(esc(run));
  return run.split(/([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]+)/).map(seg => {
    if (!seg) return '';
    if (CJK_RE.test(seg) || !looksMath(seg)) return mdInline(esc(seg));
    let head = '', core = seg, tail = '';
    const ws = core.match(/^(\s*)([\s\S]*?)(\s*)$/);
    if (ws) { head = ws[1]; core = ws[2]; tail = ws[3]; }
    const pm = core.match(/^([\s\S]*?)([，。；：、,.;:]+)$/);
    if (pm) { core = pm[1]; tail = pm[2] + tail; }
    if (!core) return mdInline(esc(seg));
    const html = tryTex(core, false);
    return head + (html || mdInline(esc(core))) + tail;
  }).join('');
}
/** 单行：处理 $...$ / \(...\)，其余按纯文本 */
function renderMathLine(line) {
  if (!line) return '';
  if (/^\s*-{3,}\s*$/.test(line)) return '<hr>';
  let out = '', last = 0, m;
  const re = /\\\\\(([\s\S]+?)\\\\\)|\$([^$\n]+?)\$/g;
  while ((m = re.exec(line))) {
    out += renderPlainRun(line.slice(last, m.index));
    const tex = m[1] != null ? m[1] : m[2];
    out += tryTex(tex, false) || mdInline(esc(m[0]));
    last = m.index + m[0].length;
  }
  out += renderPlainRun(line.slice(last));
  return out;
}
/** 整段：先把跨行的 $$...$$ / \[...\] 整块渲染，剩下的按行处理 */
function mathHtml(raw) {
  const src = String(raw == null ? '' : raw);
  if (!window.katex) return esc(src);
  let out = '', last = 0, m;
  const blockRe = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g;
  const inlineLines = t => t.split('\n').map(renderMathLine).join('\n');
  while ((m = blockRe.exec(src))) {
    out += inlineLines(src.slice(last, m.index));
    const tex = (m[1] != null ? m[1] : m[2]).replace(/\s*\n\s*/g, ' ');
    const html = tryTex(tex, true);
    out += html ? '\n<div class="mathblock">' + html + '</div>\n' : mdInline(esc(m[0]));
    last = m.index + m[0].length;
  }
  out += inlineLines(src.slice(last));
  return out;
}
const now = () => Date.now();
const DAY = 86400000;
function fmtDate(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function relTime(t) {
  const d = now() - t;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < DAY) return Math.floor(d / 3600000) + ' 小时前';
  if (d < DAY * 7) return Math.floor(d / DAY) + ' 天前';
  return fmtDate(t);
}
let toastTimer = null;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toastAct">${esc(action.label)}</button>` : '');
  el.classList.add('on');
  if (action) { $('#toastAct').onclick = () => { el.classList.remove('on'); action.fn(); }; }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), action ? 5200 : 2400);
}
function openSheet(html) {
  $('#sheetBox').innerHTML = html;
  $('#sheet').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

/* ============================================================
   1. IndexedDB
   ============================================================ */
const DB_NAME = 'cuoti-db', DB_VER = 1;
let _db = null;
function dbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('banks')) db.createObjectStore('banks', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('questions')) {
        const s = db.createObjectStore('questions', { keyPath: 'id' });
        s.createIndex('bankId', 'bankId');
      }
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode) { return _db.transaction(store, mode).objectStore(store); }
function dbGet(store, key) {
  return new Promise((res, rej) => { const r = tx(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
function dbAll(store) {
  return new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
}
function dbPut(store, val) {
  return new Promise((res, rej) => { const r = tx(store, 'readwrite').put(val); r.onsuccess = () => res(val); r.onerror = () => rej(r.error); });
}
function dbDel(store, key) {
  return new Promise((res, rej) => { const r = tx(store, 'readwrite').delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
}
function dbClear(store) {
  return new Promise((res, rej) => { const r = tx(store, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
}
function dbBulkPut(store, arr) {
  return new Promise((res, rej) => {
    const t = _db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    arr.forEach(v => os.put(v));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}

/* ============================================================
   2. 全局状态
   ============================================================ */
const DEFAULT_SETTINGS = {
  text: { baseUrl: 'https://api.deepseek.com/v1', apiKey: '', model: 'deepseek-chat' },
  vision: { baseUrl: '', apiKey: '', model: '' },   // 留空 = 复用文字通道
  img: 'single',                                    // 拍照压缩档位，见 IMG_MODES
  proxy: true,
  proxyUrl: '',                                     // 留空 = 同源 /proxy；部署到别处时填 Worker 地址
  reportDays: 7
};
var S = {
  banks: [], qs: [], settings: { ...DEFAULT_SETTINGS },
  imgCache: new Map(), tagNotes: {},
  review: null,
  lastSlash: null
};
function migrateSettings(v) {
  if (!v) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if (v.text && v.vision) return Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), v);
  return {
    text: { baseUrl: v.baseUrl || DEFAULT_SETTINGS.text.baseUrl, apiKey: v.apiKey || '', model: v.textModel || 'deepseek-chat' },
    vision: { baseUrl: '', apiKey: '', model: v.visionModel || '' },
    reportDays: v.reportDays || 7
  };
}

/** 旧数据里 \frac 曾被 JSON 当成换页符吃成 "rac"，这里按控制字符还原回去 */
function fixCtrlText(s) {
  if (!s || typeof s !== 'string') return s;
  if (!/[\x08\x09\x0b\x0c\x0d]/.test(s)) return s;
  return s.replace(/\x0c/g, '\\f').replace(/\x08/g, '\\b')
          .replace(/\x0b/g, '\\v').replace(/\x0d/g, '\\r').replace(/\x09/g, '\\t');
}

/** 把 \(...\) / \[...\] 统一成 $...$ / $$...$$，顺便清掉多余空白 */
function normalizeMathText(s) {
  if (!s) return s;
  return String(s)
    .replace(/\\n(?![a-z])/g, '\n')
    .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => '$$' + t.trim() + '$$')

const TRASH_DAYS = 15;
async function purgeExpiredTrash() {
  const limit = TRASH_DAYS * DAY;
  const t = now();
  const expired = [];
  for (const q of S.qs) {
    if (!q.trashed) continue;
    // 老数据没有删除时间：从现在开始算 15 天，绝不直接清掉
    if (!q.deletedAt) { q.deletedAt = t; await dbPut('questions', q); continue; }
    if (t - q.deletedAt > limit) expired.push(q);
  }
  if (!expired.length) return 0;
  for (const q of expired) {
    for (const i of allImgs(q)) await dbDel('images', i);
    await dbDel('questions', q.id);
  }
  const ids = new Set(expired.map(q => q.id));
  S.qs = S.qs.filter(q => !ids.has(q.id));
  return expired.length;
}
/** 还剩几天被清掉（用于回收站列表） */
function trashDaysLeft(q) {
  const spent = now() - (q.deletedAt || now());
  return Math.max(0, Math.ceil((TRASH_DAYS * DAY - spent) / DAY));
}

// 只有在「网页版 + 静态托管没有 /proxy」这种情况下，用户才需要去设置里自己填一个。
const REMOTE_PROXY = '';
function chan(name) {
  const st = S.settings, t = st.text || {}, v = st.vision || {};
  if (name === 'vision') {
    return { baseUrl: v.baseUrl || t.baseUrl || '', apiKey: v.apiKey || t.apiKey || '', model: v.model || '' };
  }

/** APP 壳里会注入 window.NativeHTTP；网页版没有，返回 false */
function hasNative() {
  return !!(window.NativeHTTP && typeof window.NativeHTTP.post === 'function');

/**
 * 把请求交给 Java 层发（HttpURLConnection）。返回一个和 fetch 响应同形状的对象，
 * 后面统一用 resp.status / resp.ok / resp.text() 处理，两条路径的代码不必分叉。
 *
 * 这里刻意做成异步：Java 发完请求再回调 window.__nativeHTTPDone(id, raw)。
 * 如果用同步接口，识图那几十秒会把 JS 线程整个卡住，转圈动画也停。
 */
let nativeSeq = 0;
const nativePending = new Map();
window.__nativeHTTPDone = function (id, raw) {
  const done = nativePending.get(id);
  if (!done) return;
  nativePending.delete(id);
  done(raw);
};

function nativePost(url, payload) {
  return new Promise((resolve, reject) => {
    const id = 'n' + (++nativeSeq);
    const timer = setTimeout(() => {
      nativePending.delete(id);
      reject(new Error('原生通道超过 200 秒没回应'));
    }, 200000);
    nativePending.set(id, raw => {
      clearTimeout(timer);
      let j;
      try { j = JSON.parse(raw); } catch (e) {
        return reject(new Error('原生通道返回异常：' + String(raw).slice(0, 120)));
      }
      if (!j.ok) return reject(new Error(j.error || '原生请求失败'));
      resolve({
        ok: j.status >= 200 && j.status < 300,
        status: j.status,
        text: () => Promise.resolve(j.body || '')
      });
    });
    try {
      window.NativeHTTP.post(url, JSON.stringify(payload.headers || {}), payload.body || '', id);
    } catch (e) {
      clearTimeout(timer);
      nativePending.delete(id);
      reject(e);
    }
  });
}
async function aiChat(messages, opt) {

    if (!useProxy) {
      try { resp = await fetch(target, payload); } catch (e) { lastErr = e; }
    } else {
      for (const b of cand) {

          resp = await fetch(b + '/proxy?u=' + encodeURIComponent(target), payload);
          if (resp) { S.goodProxy = b; break; }
        } catch (e) { lastErr = e; if (S.goodProxy === b) S.goodProxy = null; }
      }
    }
    if (!resp) {
      throw new Error('网络请求失败：' + ((lastErr && lastErr.message) || '连不上') +
        (useProxy ? '（本机服务没跑，线上代理也没连上——检查网络或设置里的「代理地址」）'
                  : '（浏览器跨域被拦，去设置打开「代理」）'));

  if (!resp.ok) throw new Error('API 错误 ' + resp.status + '：' + text.slice(0, 300));
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('返回不是 JSON：' + text.slice(0, 200)); }
  const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (c == null) throw new Error('返回结构异常：' + text.slice(0, 200));

}
function parseJSON(txt) {
  if (!txt) throw new Error('AI 没有返回内容');
  let t = txt.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try {
    return JSON.parse(t);
  } catch (e1) {
    // 模型写 LaTeX 时经常忘记转义反斜杠（\frac、\dfrac 里的 \f \d），
    // 这会让 JSON.parse 直接报 Bad escaped character，先修一遍再解析。
    const fixed = repairJsonString(t);
    try {
      return JSON.parse(fixed);
    } catch (e2) {
      throw new Error('AI 返回的 JSON 修不好：' + e2.message);
    }
  }
}

/** 逐字符走一遍字符串，把非法的反斜杠转义补齐，顺手处理裸换行和尾逗号 */
function repairJsonString(t) {
  let out = '';
  let inStr = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (!inStr) {
      if (c === '"') inStr = true;
      out += c;
      continue;
    }
    if (c === '\\') {
      const n = t[i + 1];
      if (n === undefined) { out += '\\\\'; continue; }
      if (n === 'u') {
        const hex = t.slice(i + 2, i + 6);
        if (/^[0-9a-fA-F]{4}$/.test(hex)) { out += '\\u' + hex; i += 5; }
        else out += '\\\\';
        continue;
      }
      if ('"\\/'.includes(n)) { out += '\\' + n; i++; continue; }
      if ('bfnrt'.includes(n)) {
        // \frac \beta \times \nu 这类：反斜杠后面紧跟字母，说明是 LaTeX 命令而不是转义字符
        if (/[A-Za-z]/.test(t[i + 2] || '')) { out += '\\\\' + n; i++; continue; }
        out += '\\' + n; i++; continue;
      }
      out += '\\\\';                    // 其余非法转义（\d \s \l …）补一个反斜杠
      continue;
    }
    if (c === '"') inStr = false;
    if (c === '\n') { out += '\\n'; continue; }
    if (c === '\r') { out += '\\r'; continue; }
    if (c === '\t') { out += '\\t'; continue; }
    out += c;
  }
  return out.replace(/,\s*([}\]])/g, '$1');
}

function readFile(file) {

}

 * 清晰度越高，识图模型吃的 token 越多（Qwen-VL 按像素切块算），按需选。

function compressImage(file, maxSide, quality) {
  const m = imgMode();
  maxSide = maxSide || m.side;
  quality = quality || m.q;
  return new Promise(async (res, rej) => {
    try {
      const dataUrl = await readFile(file);
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        cv.toBlob(b => res({ blob: b, dataUrl: cv.toDataURL('image/jpeg', quality), w, h }), 'image/jpeg', quality);
      };
      img.onerror = () => rej(new Error('图片读取失败'));
      img.src = dataUrl;
    } catch (e) { rej(e); }
  });
}
const blobToDataUrl = blob => new Promise((res, rej) => {

});

      case 'exam': viewExam(); break;
      case 'settings': viewSettings(); break;

}

var CROP = null;
function openCrop(which, i) {
  const list = which === 'q' ? ADD.qImgs : ADD.aImgs;
  const im = list[i];
  if (!im) return;
  const img = new Image();
  img.onload = () => { CROP = { which, i, img, rect: null, start: null }; mountCrop(); };

/** 自动找题目区域：Otsu 二值化 → 行投影切块 → 取中线所在的块 → 收缩到列范围 */
function autoDetectRect(img) {
  const target = 520;
  const sc = Math.min(1, target / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(8, Math.round(img.naturalWidth * sc));
  const h = Math.max(8, Math.round(img.naturalHeight * sc));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const gray = new Uint8ClampedArray(w * h);
  const hist = new Array(256).fill(0);
  let sum = 0;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    gray[p] = g; sum += g; hist[g]++;
  }
  const mean = sum / (w * h);
  const darkInk = mean > 118;                    // 白纸黑字：比阈值暗的算字

  // Otsu 阈值
  const total = gray.length;
  let sumAll = 0;
  for (let i = 0; i < 256; i++) sumAll += i * hist[i];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sumAll - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) { best = between; thr = t; }
  }
  if (best <= 0) thr = mean;
  const isInk = g => darkInk ? g < thr : g > thr;

  // 行投影
  const rowInk = new Int32Array(h);
  for (let y = 0; y < h; y++) {
    const off = y * w; let c = 0;
    for (let x = 0; x < w; x++) if (isInk(gray[off + x])) c++;
    rowInk[y] = c;
  }
  const rowMin = Math.max(2, w * 0.004);
  const buildBands = (ratio) => {
    const gapMerge = Math.max(2, Math.round(h * ratio));
    const out = [];
    let st = -1, lastInk = -1;
    for (let y = 0; y < h; y++) {
      if (rowInk[y] >= rowMin) {
        if (st < 0) st = y;
        lastInk = y;
      } else if (st >= 0 && y - lastInk > gapMerge) {
        out.push([st, lastInk]); st = -1;
      }
    }
    if (st >= 0) out.push([st, lastInk]);
    return out;
  };
  // 空白行少（密排的整页）时逐步放大切分间距，尽量切出“一道题”的块
  let bands = buildBands(0.013);
  for (const r of [0.026, 0.045]) {
    if (bands.length > 1) break;
    const alt = buildBands(r);
    if (alt.length > 1) bands = alt;
  }
  if (!bands.length) return null;

  // 取包含中线的块；没有就取最大的
  const cy = h / 2;
  let pick = bands.find(b => cy >= b[0] && cy <= b[1]);
  if (!pick) pick = bands.slice().sort((a, b) => (b[1] - b[0]) - (a[1] - a[0]))[0];
  const y0 = pick[0], y1 = pick[1];

  // 列范围
  let x0 = w, x1 = -1;
  for (let y = y0; y <= y1; y++) {
    const off = y * w;
    for (let x = 0; x < w; x++) {
      if (isInk(gray[off + x])) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
    }
  }
  if (x1 <= x0) return null;

  const padX = w * 0.015, padY = h * 0.012;
  return {
    x0: Math.max(0, x0 - padX), x1: Math.min(w, x1 + padX),
    y0: Math.max(0, y0 - padY), y1: Math.min(h, y1 + padY),
    w, h
  };
}

/** 把自动框选结果套到当前裁剪画布上 */
function autoCropBox() {
  if (!CROP) return;
  const cv = document.getElementById('cropCv');
  if (!cv) return;
  const r = autoDetectRect(CROP.img);
  if (!r) { toast('没找到明显的内容边界，手动框一下'); return; }
  const k = cv.width / r.w;
  CROP.rect = {
    x: r.x0 * k, y: r.y0 * k,
    w: (r.x1 - r.x0) * k, h: (r.y1 - r.y0) * k
  };
  cropDraw();
}

function mountCrop() {
  let ov = document.getElementById('cropOv');
  if (!ov) { ov = document.createElement('div'); ov.id = 'cropOv'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="cropbar">已自动框出题目，可拖动重选<br><span style="opacity:.6">方向不对就点下面的旋转</span></div>
    <div class="croprot"><button class="btn ghost sm" onclick="rotateCrop(-90)">↺ 左转</button>
      <button class="btn ghost sm" onclick="rotateCrop(90)">↻ 右转</button>
      <button class="btn ghost sm" onclick="rotateCrop(180)">⇅ 倒转</button></div>
    <canvas id="cropCv"></canvas>
    <div class="cropact">
      <button class="btn ghost" onclick="closeCrop()">取消</button>
      <button class="btn ghost" onclick="autoCropBox()">自动框</button>
      <button class="btn primary" onclick="applyCrop()">裁剪</button>
    </div>`;
  ov.classList.add('on');
  const cv = document.getElementById('cropCv');
  const maxW = Math.min(window.innerWidth - 32, 860);
  const maxH = window.innerHeight * 0.6;
  const sc = Math.min(maxW / CROP.img.naturalWidth, maxH / CROP.img.naturalHeight, 1);
  cv.width = Math.round(CROP.img.naturalWidth * sc);
  cv.height = Math.round(CROP.img.naturalHeight * sc);
  cv.style.width = cv.width + 'px';
  cv.style.height = cv.height + 'px';
  cropDraw();
  if (!CROP.rect) autoCropBox();
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(cv.width, e.clientX - r.left)),
      y: Math.max(0, Math.min(cv.height, e.clientY - r.top))
    };
  };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); CROP.start = pos(e); CROP.rect = null; cropDraw(); });
  cv.addEventListener('pointermove', e => {
    if (!CROP.start) return;
    e.preventDefault();
    const p = pos(e);
    CROP.rect = {
      x: Math.min(CROP.start.x, p.x), y: Math.min(CROP.start.y, p.y),
      w: Math.abs(p.x - CROP.start.x), h: Math.abs(p.y - CROP.start.y)
    };
    cropDraw();
  });
  cv.addEventListener('pointerup', e => { e.preventDefault(); CROP.start = null; cropDraw(); });
  cv.addEventListener('pointercancel', () => { CROP.start = null; cropDraw(); });
}
function cropDraw() {
  const cv = document.getElementById('cropCv');
  if (!cv || !CROP) return;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(CROP.img, 0, 0, cv.width, cv.height);
  const r = CROP.rect;
  ctx.fillStyle = 'rgba(8,12,20,.58)';
  if (r) {
    ctx.fillRect(0, 0, cv.width, r.y);
    ctx.fillRect(0, r.y + r.h, cv.width, cv.height - r.y - r.h);
    ctx.fillRect(0, r.y, r.x, r.h);
    ctx.fillRect(r.x + r.w, r.y, cv.width - r.x - r.w, r.h);
    ctx.strokeStyle = '#2f6fed'; ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, Math.max(0, r.w - 2), Math.max(0, r.h - 2));
  } else {
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  if (CROP.start) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(CROP.start.x, CROP.start.y, 1, 1);
  }
}
async function applyCrop() {
  if (!CROP || !CROP.rect) return toast('先在图上拖一个框');
  const r = CROP.rect;
  if (r.w < 30 || r.h < 30) return toast('框太小了，重新拖一个大一点的');
  const img = CROP.img;
  const cvEl = document.getElementById('cropCv');
  const sc = img.naturalWidth / cvEl.width;
  const sx = r.x * sc, sy = r.y * sc, sw = r.w * sc, sh = r.h * sc;
  const cap = 2400;
  const k = Math.min(1, cap / Math.max(sw, sh));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(sw * k));
  cv.height = Math.max(1, Math.round(sh * k));
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.92));
  const dataUrl = cv.toDataURL('image/jpeg', 0.92);
  const which = CROP.which, idx = CROP.i;
  const list = which === 'q' ? ADD.qImgs : ADD.aImgs;
  list[idx] = { blob, dataUrl };
  closeCrop();
  mount(addHtml());
  toast('已裁剪，可以点「识别题干」了');
  const target = which === 'q' ? ADD.question : ADD.analysis;
  if (!target.trim() && chan('vision').model && !ADD.busy) aiRecognize(which);
}

/** 把当前裁剪图旋转 90/180 度后重新框选 */
function rotateCrop(deg) {
  if (!CROP) return;
  const img = CROP.img;
  const swap = Math.abs(deg) % 180 === 90;
  const cv = document.createElement('canvas');
  cv.width = swap ? img.naturalHeight : img.naturalWidth;
  cv.height = swap ? img.naturalWidth : img.naturalHeight;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
  const url = cv.toDataURL('image/jpeg', 0.92);
  const nimg = new Image();
  nimg.onload = () => { CROP.img = nimg; CROP.rect = null; mountCrop(); };
  nimg.src = url;
}

function closeCrop() {
  const ov = document.getElementById('cropOv');
  if (ov) { ov.classList.remove('on'); ov.innerHTML = ''; }
  CROP = null;
}

function tagKey(e) {
  // 中文输入法还在组字时不要抢回车，否则拼音会被吞掉、光标跳去别处
  if (e.isComposing || e.keyCode === 229) return;

function toText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number') return String(v);
  if (Array.isArray(v)) return v.map(toText).filter(Boolean).join('\n');
  if (typeof v === 'object') return Object.values(v).map(toText).filter(Boolean).join('\n');
  return String(v);
}
async function aiRecognize(which) {
  which = which || 'q';
  const list = which === 'q' ? ADD.qImgs : ADD.aImgs;
  if (!chan('vision').model) return toast('还没配识图模型，去「设置 ②」里填，或手动输入');
  if (!list.length) return toast('先加一张照片');
  ADD.busy = 'recog-' + which; mount(addHtml());
  try {
    const sys = which === 'q' ? SYS_RECOGNIZE_Q : SYS_RECOGNIZE_A;
    const mk = (fmt) => {
      const content = [{ type: 'text', text: which === 'q' ? '识别这些照片里的题目。' : '识别这些照片里的答案和解析。' }];
      list.forEach(im => content.push({ type: 'image_url', image_url: { url: fmt === 'raw' ? im.dataUrl.split(',')[1] : im.dataUrl } }));
      return aiChat([{ role: 'system', content: sys }, { role: 'user', content }], { channel: 'vision' });
    };
    let out;
    try { out = await mk('data'); }
    catch (e1) {
      if (!/400|422|image|url|invalid/i.test(e1.message)) throw e1;
      out = await mk('raw');

    const j = parseJSON(out);
    if (which === 'q') {

      if (Array.isArray(j.tags)) for (const t of j.tags) { const v = toText(t); if (v && !ADD.tags.includes(v)) ADD.tags.push(v); }

}

/* ============================================================
   10. 复习（间隔重复）
   ============================================================ */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function srsGrade(q, ok) {
  const s = q.srs || (q.srs = { ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: 0 });
  s.last = now();
  if (ok) {
    s.reps++;
    if (s.reps === 1) s.ivl = 1;
    else if (s.reps === 2) s.ivl = 3;
    else s.ivl = Math.max(4, Math.round(s.ivl * (s.ease || 2.5)));
    s.ease = Math.min(2.8, (s.ease || 2.5) + 0.05);
    s.due = now() + s.ivl * DAY;
  } else {
    s.lapses++;
    s.reps = 0;
    s.ivl = 0;
    s.ease = Math.max(1.3, (s.ease || 2.5) - 0.2);
    s.due = now() + 10 * 60000;

async function gradeReview(ok) {

function slash(qid, inReview) {
  const q = qById(qid); if (!q) return;
  if (inReview && S.slashSkip) { doSlash(qid, [], 1); return; }
  const tags = q.tags || [];
  const sameTag = tags.length ? S.qs.filter(x => !x.trashed && x.id !== q.id &&
    (x.tags || []).some(t => tags.includes(t)) && mastery(x) >= 2) : [];
  openSheet(`<b>斩掉这道题</b>
    <div class="tiny" style="margin:8px 0 14px">斩掉的题会从复习里消失，进回收站保留 15 天，随时能捞回来。</div>
    <button class="btn primary wide" onclick="doSlash('${qid}',[],${inReview ? 1 : 0})">只斩这一题</button>
    ${sameTag.length ? `<button class="btn ghost wide" style="margin-top:10px" onclick="doSlash('${qid}',[${sameTag.map(x => `'${x.id}'`).join(',')}],${inReview ? 1 : 0})">
      连同「${esc(tags[0])}」下已熟练的 ${sameTag.length} 题一起斩</button>
      <div class="tiny" style="margin-top:8px;text-align:center">这 ${sameTag.length} 题都已经复习过、标为熟练</div>` : ''}
    ${inReview ? `<label class="row" style="justify-content:center;margin-top:16px;gap:8px;font-size:13px;color:#6b7280">
      <input type="checkbox" id="slashSkip" style="width:18px;height:18px;margin:0"> 本轮复习不再询问</label>` : ''}
    <button class="btn ghost wide" style="margin-top:10px" onclick="closeSheet()">取消</button>`);
}
async function doSlash(qid, extra, inReview) {
  const sk = document.getElementById('slashSkip');
  if (sk && sk.checked) S.slashSkip = true;
  closeSheet();
  const ids = [qid, ...extra];
  const list = ids.map(id => qById(id)).filter(Boolean);
  for (const q of list) { q.trashed = true; q.deletedAt = now(); q.slashed = true; await dbPut('questions', q); }
  if (inReview && S.review) {
    S.review.list = S.review.list.filter(q => !ids.includes(q.id));
    if (S.review.idx >= S.review.list.length) S.review.done = true;
  }
  toast(`已斩 ${ids.length} 题`, {
    label: '撤销', fn: async () => {
      for (const q of list) { q.trashed = false; q.slashed = false; await dbPut('questions', q); }
      render();
    }
  });
  render();
}

function tagSegs(t) { return String(t || '').split(/[-－—\/·、,，]/).map(x => x.trim()).filter(Boolean); }
const GENERIC_TAG = new Set(['高数', '英语', '数学', '语文', '物理', '化学', '期末', '四级', '六级', '词汇', '练习']);
function tagScore(a, b) {
  if (a === b) return 5;
  let sc = 0;
  for (const x of tagSegs(a)) for (const y of tagSegs(b)) {
    if (!x || !y) continue;
    if (x === y) { if (!GENERIC_TAG.has(x)) sc += x.length >= 3 ? 3 : 2; }
    else if (x.length >= 2 && y.length >= 2 && (x.includes(y) || y.includes(x))) sc += 1;
  }
  return sc;
}
function similarPool() {
  return S.qs.filter(x => { const b = bankById(x.bankId); return !x.trashed && b && b.kind === 'source'; });
}
function rankSimilar(q, pool) {
  const tags = q.tags || [];
  return pool.map(x => {
    let sc = 0;
    for (const a of tags) for (const b of (x.tags || [])) sc += tagScore(a, b);
    return { x, sc };
  }).filter(r => r.sc > 0).sort((a, b) => b.sc - a.sc);
}
function showSimilarSheet(q, list, hint) {
  openSheet(`<b>找到 ${list.length} 道同类题</b>
    <div class="tiny" style="margin:8px 0 14px">${esc(hint)}练完不计入你的熟练度。</div>
    <button class="btn primary wide" onclick="closeSheet();startSimilar([${list.map(x => `'${x.id}'`).join(',')}])">开始练这 ${list.length} 题</button>
    <button class="btn ghost wide" style="margin-top:10px" onclick="closeSheet()">取消</button>`);
}
function findSimilar(qid) {
  const q = qById(qid); if (!q) return;
  const pool = similarPool();
  if (!pool.length) return toast('还没装题源，点首页「📦 题源」装一个');
  if (!(q.tags || []).length) return toast('先给这道题加个标签，才能按考点找同类题');
  const ranked = rankSimilar(q, pool);
  if (ranked.length >= 3) {
    return showSimilarSheet(q, ranked.slice(0, 6).map(r => r.x), `按标签「${(q.tags)[0]}」从题源里筛的，`);
  }
  if (!chan('text').apiKey) {
    if (ranked.length) return showSimilarSheet(q, ranked.slice(0, 6).map(r => r.x), '按标签匹配到的，');
    return toast('题源里没找到同考点的题');
  }
  aiPickSimilar(q, pool, ranked);
}
async function aiPickSimilar(q, pool, ranked) {
  toast('正在从题源里挑题…');
  const base = ranked.slice(0, 40).map(r => r.x);
  const rest = pool.filter(x => !base.includes(x)).slice(0, 60);
  const cand = [...base, ...rest].slice(0, 80);
  const lines = cand.map((x, i) => `[${i}] ${x.question.slice(0, 70).replace(/\n/g, ' ')}`).join('\n');
  try {
    const out = await aiChat([
      { role: 'system', content: '你在帮学生挑同类练习题。只输出 JSON：{"picks":[题目编号]}。挑和原题考查同一知识点、同一解法的题，宁少勿滥。' },
      { role: 'user', content: `原题：\n${q.question.slice(0, 400)}\n\n候选：\n${lines}\n\n挑出最多 6 道最相近的。` }
    ]);
    const j = parseJSON(out);
    const list = (j.picks || []).map(i => cand[i]).filter(Boolean).slice(0, 6);
    if (!list.length) return toast('没挑出合适的题，试试把标签写具体点');
    showSimilarSheet(q, list, '按考点由 AI 从题源里挑的，');
  } catch (e) {
    if (ranked.length) return showSimilarSheet(q, ranked.slice(0, 6).map(r => r.x), '按标签匹配到的，');
    toast('挑题失败：' + e.message);
  }
}
function startSimilar(ids) {
  const list = ids.map(qById).filter(Boolean);
  if (!list.length) return;
  S.review = { key: 'similar/' + Date.now(), bankId: null, mode: 'similar', list, idx: 0, show: false, ok: 0, bad: 0, done: false };
  nav('#/review/similar/' + Date.now());
}

/** 本地即时诊断：不联网、不算 token，打开就有 */
function quickDiagnosis() {
  const act = activeQs();
  const tagStat = {};
  act.forEach(q => {
    const lapses = (q.srs && q.srs.lapses) || 0;
    const isNew = !q.srs || !q.srs.reps;
    (q.tags || []).forEach(t => {
      const s = tagStat[t] || (tagStat[t] = { n: 0, lapses: 0, fresh: 0 });
      s.n++; s.lapses += lapses; if (isNew) s.fresh++;
    });
  });
  const due = dueList().length;
  const weak = Object.entries(tagStat)
    .filter(([, s]) => s.lapses > 0)
    .sort((a, b) => b[1].lapses - a[1].lapses)
    .slice(0, 3);
  const forgotten = act
    .filter(q => q.srs && q.srs.lapses >= 2)
    .sort((a, b) => b.srs.lapses - a.srs.lapses)
    .slice(0, 3);
  const freshTags = Object.entries(tagStat)
    .filter(([, s]) => s.lapses === 0 && s.fresh > 0)
    .sort((a, b) => b[1].fresh - a[1].fresh)
    .slice(0, 2);
  return { act, due, weak, forgotten, freshTags, tagStat };
}
function diagnosisHtml() {
  const d = quickDiagnosis();
  const lines = [];
  if (d.due > 0) lines.push(`<b>今天先刷：</b>${d.due} 道到期题，从「今日复习」进去最快。`);
  else lines.push(`<b>今天没有到期题。</b>可以去错题本随手翻 10 道。`);
  if (d.weak.length) {
    lines.push(`<b>最该补：</b>${d.weak.map(([t, s]) => `${esc(t)}（忘 ${s.lapses} 次）`).join('、')}`);
  } else if (d.act.length) {
    lines.push(`<b>还没有反复忘的考点</b>，说明前几轮复习是有效的。`);
  }
  if (d.forgotten.length) {
    lines.push(`<b>反复忘的题：</b>` + d.forgotten.map(q =>
      `<span style="color:#2f6fed">${esc((q.tags || ['无标签'])[0])}</span> 忘了 ${q.srs.lapses} 次`).join('；'));
  }
  if (d.freshTags.length) {
    lines.push(`<b>还没碰的新内容：</b>${d.freshTags.map(([t, s]) => `${esc(t)}（${s.fresh} 题）`).join('、')}`);
  }
  lines.push(`<b>建议：</b>${d.due > 0 ? '先把到期题清掉，再选 10 题小测验收。' : '选 10 题做个小测，比重新看一遍有效。'}`);
  return `<div class="ans" style="line-height:1.9">${lines.map(l => `<div style="margin-bottom:6px">${l}</div>`).join('')}</div>`;
}

function examPool() {
  // 真题池包含你自己的错题 + 已装的题源（与界面上「真题 = 错题 + 题库包」的说明一致）
  const bid = EXAM.bankId === 'all' ? null : EXAM.bankId;

function examPaperHtml(p) {
  return `<div id="paper" class="card" style="margin-top:16px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700">${esc(p.title)}</div>

    </div>`).join('')}

async function genExam() {
  const pool = examPool();
  const n = EXAM.count;
  EXAM.busy = true; viewExam();
  try {
    let chosen = [];
    if (EXAM.src !== 'ai') {
      const real = shuffle(pool.slice());
      chosen = real.slice(0, EXAM.src === 'real' ? Math.min(n, real.length) : Math.ceil(n * 0.6));
    }
    const need = Math.max(0, n - chosen.length);
    let gen = [];
    if (need > 0) {
      if (!S.settings.apiKey) { if (!chosen.length) throw new Error('没有配 API Key，无法生成变式题'); }
      else {
        const seeds = (chosen.length ? chosen : pool).slice(0, 8)
          .map(q => `题目：${q.question}\n解析：${(q.analysis || '').slice(0, 400)}`).join('\n---\n');
        const out = await aiChat([
          { role: 'system', content: SYS_EXAM },
          { role: 'user', content: `参考题：\n${seeds}\n\n请生成 ${need} 道同知识点的变式题。` }
        ]);
        const j = parseJSON(out);
        gen = (j.questions || []).slice(0, need).map(x => ({ q: toText(x.q), a: toText(x.a), src: 'ai' }));
      }
    }
    const questions = [
      ...chosen.map(q => ({ q: q.question, a: q.analysis || '（无解析）', src: 'real' })),
      ...gen
    ];
    if (!questions.length) throw new Error('没有可出的题');
    EXAM.paper = { title: '错题变式练习卷', questions, at: now(), bankId: EXAM.bankId };
  } catch (e) { toast('出卷失败：' + e.message); }
  EXAM.busy = false; viewExam();
  const p = $('#paper'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth' });
}

async function applyRestore(j) {
  if (!j || !Array.isArray(j.banks) || !Array.isArray(j.questions)) throw new Error('不是有效的备份文件');
  await dbClear('banks'); await dbClear('questions'); await dbClear('images');
  for (const b of j.banks) await dbPut('banks', b);
  for (const q of j.questions) await dbPut('questions', q);
  let imgFail = 0;
  for (const im of (j.images || [])) {
    try {
      const blob = await (await fetch(im.data)).blob();
      await dbPut('images', { id: im.id, blob, createdAt: now() });
    } catch (e) { imgFail++; }
  }
  S.imgCache.clear();
  await loadAll();
  render();
  const mine = j.banks.filter(b => b.kind !== 'source').length;
  toast(imgFail ? `恢复完成（${imgFail} 张图失败）` : `恢复完成：${mine} 个我的题库`);
}

async function importPack(input) {

async function importPackData(j, opt) {
  opt = opt || {};
  // 防呆：这是完整备份而不是题源包时，别把它当题源塞进去
  if (j && j.app === 'cuoti' && Array.isArray(j.banks)) {
    if (!confirm('这是「完整备份」（含你的错题和复习记录），不是题源包。\n\n要恢复到本机吗？会覆盖现有数据。')) return;
    await applyRestore(j);
    return;
  }
  const name = j.name || '题库包';
  const list = Array.isArray(j.questions) ? j.questions : (Array.isArray(j) ? j : null);
  if (!list) throw new Error('格式不对，需要 {"name":"...","questions":[{"q":"..","a":"..","tags":[]}]}');
  // 同名题源已存在时做「补齐」而不是重复建库：按题干去重，只补缺的
  let b = S.banks.find(x => x.name === name && x.kind === 'source');
  const isNew = !b;
  if (isNew) {
    b = { id: uid(), name, icon: j.subject === '英语' ? '🔤' : '📦', kind: 'source', createdAt: now() };
    await dbPut('banks', b); S.banks.push(b);
  }
  const normQ = s => String(s || '').replace(/\s+/g, '').trim();
  const have = new Set(S.qs.filter(q => q.bankId === b.id).map(q => normQ(q.question)));
  const rows = [];
  for (const x of list) {
    const text = toText(x.q || x.question);
    if (!text.trim()) continue;
    const key = normQ(text);
    if (have.has(key)) continue;
    have.add(key);
    rows.push({
      id: uid(), bankId: b.id, question: text, analysis: toText(x.a || x.analysis),
      tags: x.tags || [], imgs: [], origin: 'pack', createdAt: now(), updatedAt: now(), trashed: false,
      srs: { ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: 0 }
    });
  }
  if (rows.length) {
    await dbBulkPut('questions', rows);
    S.qs.push(...rows);
  }
  const total = S.qs.filter(q => q.bankId === b.id).length;
  if (isNew) toast(`装上题源「${name}」，共 ${total} 题`);
  else if (rows.length) toast(`「${name}」补齐 ${rows.length} 题，现在共 ${total} 题`);
  else toast(`「${name}」已经是完整的 ${total} 题了`);
  nav('#/packs');
}

    icon: src.icon || '📘', color: '#eef3ff', kind: 'mine', createdAt: now()
  };
  await dbPut('banks', nb);
  S.banks.push(nb);
  const rows = list.map(q => ({
    id: uid(), bankId: nb.id, question: q.question, analysis: q.analysis || '',
    tags: (q.tags || []).slice(), imgs: [], origin: 'pack-copy',
    createdAt: now(), updatedAt: now(), trashed: false,
    srs: { ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: 0 }
  }));
  await dbBulkPut('questions', rows);

  toast(`已复制 ${rows.length} 题到「${nb.name}」`);

      <div class="tagrow"><span class="tag" style="background:#f1f4f9;color:#8b93a1">${q.slashed ? '已斩' : '已删'} ${relTime(q.deletedAt || q.createdAt)} · 还剩 ${trashDaysLeft(q)} 天</span>
        <div class="sp"></div>
        <span class="tiny" style="text-decoration:underline" onclick="restoreQ('${q.id}')">恢复</span>
        <span class="tiny" style="color:#d92d20;margin-left:10px;text-decoration:underline" onclick="purgeQ('${q.id}')">彻底删除</span></div>
    </div>`).join('');
    body += `<button class="btn danger wide" style="margin:10px 0 30px" onclick="purgeAll()">清空回收站</button>`;
  }
  mount(hdr('回收站', '#/settings', null) + `<div class="page">${body}</div>`);
}
async function restoreQ(id) {
  const q = qById(id); if (!q) return;
  q.trashed = false; q.slashed = false; delete q.deletedAt;
  await dbPut('questions', q); render(); toast('已恢复');
}
async function purgeQ(id) {
  if (!confirm('彻底删除？无法恢复。')) return;
  const q = qById(id); if (!q) return;
  for (const i of allImgs(q)) await dbDel('images', i);
  await dbDel('questions', id);
  S.qs = S.qs.filter(x => x.id !== id); render(); toast('已彻底删除');
}
async function purgeAll() {
  if (!confirm('清空回收站？这些题将无法恢复。')) return;
  for (const q of S.qs.filter(q => q.trashed)) {
    for (const i of allImgs(q)) await dbDel('images', i);
    await dbDel('questions', q.id);
  }
  S.qs = S.qs.filter(q => !q.trashed); render(); toast('回收站已清空');
}

/* ============================================================
   15.5 题库包
   ============================================================ */
async function viewPacks() {
  const inst = sourceBanks();
  let head = `<div class="tiny" style="margin:14px 4px;line-height:1.7">题源是给<b>你的错题</b>找同类练习用的，装在后台：不进「我的题库」、不参与每日复习、不计熟练度。<br>
    想要能刷、能斩、进统计，用下面的<b>「导入我的题库」</b>复制一份。</div>`;
  if (inst.length) {
    head += `<div class="card flat"><b style="font-size:13.5px">已装的题源</b>` +
      inst.map(b => {
        const n = qsOf(b.id).length;
        return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f1f4f9">
          <div class="row">
            <div class="sp"><div style="font-size:14.5px">${esc(b.name)}</div><div class="tiny">本机 ${n} 题</div></div>
            <button class="btn sm ghost" onclick="nav('#/bank/${b.id}')">看看</button>
            <button class="btn sm danger" onclick="removeSource('${b.id}')">移除</button>
          </div>
          <div class="row" style="margin-top:8px;gap:8px">
            <button class="btn sm primary" style="flex:1" onclick="sourceToMyBank('${b.id}')">导入我的题库（${n} 题）</button>
          </div>
        </div>`;
      }).join('') + `</div>`;
  }
  head += `<label class="btn ghost wide sm" style="margin:0 0 4px;cursor:pointer;text-align:center">
      从文件导入题源（.json）<input type="file" accept="application/json,.json" hidden onchange="importPack(this)"></label>`;
  mount(hdr('题源', '#/settings', null) + `<div class="page" id="packList">${head}<div class="empty"><span class="loading dark"></span></div></div>`);
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch('packs/index.json', { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    let html = `<div class="row" style="margin:18px 4px 2px"><b style="font-size:13.5px;color:#475569">可用的题源</b></div>`;
    html += j.packs.map(p => {
      const b = S.banks.find(x => x.name === p.name && x.kind === 'source');
      const got = b ? S.qs.filter(q => q.bankId === b.id).length : 0;
      const full = got >= p.count;
      const partial = got > 0 && !full;
      return `<div class="card flat">
        <div class="row"><div class="sp"><b style="font-size:15px">${esc(p.name)}</b>
          <div class="tiny" style="margin-top:2px">${p.count} 题 · ${esc(p.subject || '')}${b ? ` · 本机已有 <b style="color:${full ? '#15803d' : '#b45309'}">${got}</b> 题` : ''}</div></div>
          <button class="btn sm ${full ? 'ghost' : 'primary'}" ${full ? 'disabled' : ''} onclick="importPackFile('${p.file}','${esc(p.name)}')">${full ? '已装完' : (partial ? '补齐' : '装上')}</button>
        </div>
        ${partial ? `<div class="tiny" style="margin-top:6px;color:#b45309">只进来了 ${got}/${p.count} 题，点「补齐」把剩下的补上（不会重复）</div>` : ''}
        <div class="tiny" style="margin-top:8px;line-height:1.6">${esc(p.desc || '')}</div>
        <div class="tiny" style="margin-top:6px;opacity:.65">来源 ${esc(p.source || '')}</div>
      </div>`;
    }).join('');
    $('#packList').innerHTML = head + html;
  } catch (e) {
    $('#packList').innerHTML = head + `<div class="empty"><div class="e">📦</div>读不到题源<br><span class="tiny">${esc(e.message)}</span></div>`;
  }
}
async function importPackFile(file, name) {
  toast('正在装「' + name + '」…');
  try {
    const r = await fetch('packs/' + file, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    await importPackData(j);
  } catch (e) { toast('导入失败：' + e.message); }
}

/* ============================================================
   16. 启动
   ============================================================ */
(async function boot() {
  try {
    await dbOpen();
    await loadAll();
    await migrateCtrlText();
    checkNewVersion();
    const purged = await purgeExpiredTrash();
    if (purged) toast(`回收站里 ${purged} 道题超过 ${TRASH_DAYS} 天，已自动清理`);
    if (!location.hash) location.hash = '#/';
    render();
    // PWA：可「添加到主屏幕」，第二次打开走离线缓存
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="page"><div class="empty"><div class="e">⚠️</div>
      存储初始化失败<br><span class="tiny">${esc(e.message)}</span><br>
      <span class="tiny">如果是从文件直接打开的，浏览器可能禁用了本地数据库，需要改用 http 地址访问。</span></div></div>`;
    console.error(e);
  }
})();
</script>
